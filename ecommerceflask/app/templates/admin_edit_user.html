<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit User</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/regform.css') }}">
    <script src="{{ url_for('static', filename='js/scripts.js') }}"></script>
</head>
<body>
    <header>
        <h1>Edit User</h1>
    </header>
    <div class="registration-container">
        <form action="{{ url_for('admin_edit_user', user_id=user[0]) }}" method="POST">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" value="{{ user[1] }}" required>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" value="{{ user[2] }}" required>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" value="{{ user[3] }}" required>
            <label for="gender">Gender:</label>
            <select id="gender" name="gender" required>
                <option value="" disabled selected>Select your gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>
            <label for="country">Country:</label>
            <select id="country" name="country" required>
                <option value="" disabled selected>Select your country</option>
                {% for country in countries %}
                    <option value="{{ country }}">{{ country }}</option>
                {% endfor %}
            </select>
            <label for="role">Role:</label>
            <select id="role" name="role" required>
                <option value="" disabled selected>Select your role</option>
                <option value="user" {% if user[6] == 'user' %}selected{% endif %}>User</option>
                <option value="admin" {% if user[6] == 'admin' %}selected{% endif %}>Admin</option>
                <option value="seller" {% if user[6] == 'seller' %}selected{% endif %}>Seller</option>
            </select>
            <input type="submit" value="Update User">
        </form>
    </div>
</body>
</html>
