<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Registration Form</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/regform.css') }}">
</head>
<body>
    <div class="registration-container">
        <form action="/submit_seller_form" method="POST" enctype="multipart/form-data">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>            

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>        

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>       

            <label for="gender">Gender:</label>
            <select id="gender" name="gender" required>
                <option value="" disabled selected>Select your gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>

            <label for="country">Country:</label>
            <select id="country" name="country" required>
                <option value="" disabled selected>Select your country</option>
                {% for country in countries %}
                    <option value="{{ country }}">{{ country }}</option>
                {% endfor %}
            </select>

            <label for="street-address">Business Street Address:</label>
            <input type="text" id="street-address" name="street_address" required>

            <label for="city">City:</label>
            <input type="text" id="city" name="city" required>

            <label for="province">Province:</label>
            <input type="text" id="province" name="province" required>

            <label for="zip-code">ZIP Code:</label>
            <input type="text" id="zip-code" name="zip_code" required>

            <label for="phone">Phone Number:</label>
            <input type="text" id="phone" name="phone" required>

            <label for="business_permit">Business Permit (Image or PDF):</label>
            <input type="file" id="business_permit" name="business_permit" accept=".pdf, image/*" required>

            <label for="valid_id">Valid ID (Image or PDF):</label>
            <input type="file" id="valid_id" name="valid_id" accept=".pdf, image/*" required>

            <input type="submit" value="submit_seller_form">
        </form>
        <div class="center-message">Already have an account? <a href="{{ url_for('login') }}">Log in here</a></div>
    </div>
</body>
</html>
