<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archived Users</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/custom_style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/navbar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/regform.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/manage_products.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        body {
            display: flex; /* Use Flexbox */
            justify-content: center; /* Center horizontally */
            align-items: center; /* Center vertically */
            height: 100vh; /* Full height of the viewport */
            margin: 0; /* Remove default body margin */
            padding: 0; /* Remove default body padding */
            background-color: #f4f4f9; /* Optional: background color for the body */
        }

        .container {
            max-width: 1000px; /* Adjusted maximum width for the container */
            width: 100%; /* Allow it to be responsive, taking 100% of the viewport width */
            padding: 0 15px; /* Optional: Add some padding to the sides */
            background-color: #F4F4F9;
            border: none;
            box-shadow: none;
            margin-bottom: 100px;
        }

        .table-wrapper {
            margin-top: 20px;
            overflow-x: auto; /* Allow horizontal scrolling if needed */
            width: 100%; /* Ensure the wrapper takes full width */
        }

        table {
            width: 100%; /* Ensure the table takes the full width */
            border-collapse: collapse; /* Ensure borders are collapsed */
        }

        th, td {
            padding: 10px; /* Consistent padding */
            text-align: center;
            border: 1px solid #ccc; /* Consistent border */
        }

        th {
            background-color: #FFF3E3;
            color: #856404;
            font-weight: bold;          
        }     

        td {
            min-height: 50px; /* Ensures minimum height for consistency */
            line-height: 1.5; /* Adjust as needed */
        }

        .button {
            padding: 8px 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px; /* Add some space on top */
        }

        .disabled-button {
            color: #ccc;
            font-style: italic;
            margin-top: 10px; /* Add some space on top */
        }
    </style>
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo-container">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Chairable Logo" class="logo">
                <span class="logoname">Chairable</span>
            </div>
            <ul class="nav-links">        
                <li><a href="{{ url_for('accounts') }}">Buyers</a></li> 
                <li><a href="{{ url_for('admin_users') }}">Sellers</a></li>
                <li><a href="{{ url_for('approvals') }}">Approvals</a></li>
                <li><a href="{{ url_for('admin_user_archive') }}">Archive</a></li>
                <li><a href="{{ url_for('admin_commissions') }}">Commissions</a></li>
            </ul>
            <div class="icon-container">
                <div class="user-profile">
                    <a href="#" aria-label="User  Profile"><i class="fas fa-user"></i></a>
                    <div class="dropdown-content">
                        <a href="{{ url_for('logout') }}" aria-label="Log Out">Log Out</a>
                    </div>
                </div>
                <a href="#" aria-label="Search"><i class="fas fa-search"></i></a>
            </div>
        </nav>
    </header>
    <main>
        <div class="container">
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Gender</th>
                            <th>Country</th>
                            <th>Role</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for user in archived_users %}
                            <tr>
                                <td >{{ user[1] }}</td>
                                <td>{{ user[2] }}</td>
                                <td>{{ user[4] }}</td>
                                <td>{{ user[5] }}</td>
                                <td>{{ user[6] }}</td>
                                <td>
                                    <form action="{{ url_for('admin_unarchive_user', user_id=user[0]) }}" method="POST" class="action-form">
                                        <input type="submit" value="Unarchive" class="action-button" onclick="return confirm('Are you sure you want to unarchive this user?');">
                                    </form>
                                    <form action="{{ url_for('admin_permanent_delete_user', user_id=user[0]) }}" method="POST" class="action-form">
                                        <input type="submit" value="Permanent Deletion" class="action-button" onclick="return confirm('Are you sure you want to permanently delete this user? This action cannot be undone.');">
                                    </form>
                                </td>
                            </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
            <button type="button" onclick="window.location.href='/admin/users';">Back to Users</button>
        </div>
    </main>
</body>
</html>
